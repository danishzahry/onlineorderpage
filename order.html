  /* Input Styles */
  label {
    font-size: 0.95rem;
    color: #d1d5db;
    margin-bottom: 8px;
    display: block;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  textarea {
    background-color: #171717;
    border: 1px solid #404040;
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 5px;
    transition: all 0.3s ease;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: #fbbf24;
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
  }

  /* Menu Item Alignment Fix */
  /* This overrides your inline 'text-align: center' for a cleaner list */
  fieldset label[style*="text-align: center"] {
    display: inline-block !important;
    text-align: left !important;
    width: 240px;
    font-weight: 500;
  }

  input[type="checkbox"], 
  input[type="radio"] {
    accent-color: #fbbf24; /* Matches the theme gold */
    width: 18px;
    height: 18px;
    vertical-align: middle;
    cursor: pointer;
  }

  input[type="number"] {
    width: 60px;
    background: #333;
    border: none;
    text-align: center;
  }

  /* Button Styling */
  button {
    width: 100%;
    background: #fbbf24;
    color: #000;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }

  button:hover {
    background: #f59e0b;
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }

  /* Image & Hints */
  img {
    border: 4px solid #333;
    border-radius: 15px;
    transition: transform 0.3s;
  }

  img:hover {
    transform: scale(1.02);
  }

  .hint {
    color: #71717a;
    font-size: 0.8rem;
    margin-top: 5px;
  }

  ::placeholder {
    color: #52525b;
  }

  <body style="background-color: lightblue;">

      <h1 style="text-align: center;">Order now</h1>
      
      <fieldset>
    <legend>Customer Information</legend>

    <form action="receipt.php" method="post">
      <div class="field">
        <label for="customerName">Customer Name</label>
        <input
          type="text"
          id="customerName" 
          name="customerName"
          placeholder="e.g., Kassim Selamat"
          autocomplete="name"
          required
          minlength="2"
        />
      </div>

      <div class="field">
        <label for="homeAddress">Home Address</label>
        <textarea
          id="homeAddress"
          name="homeAddress"
          placeholder="Street, City, State, Postcode"
          rows="3"
          autocomplete="street-address"
          required
        ></textarea>
      </div>

      <div class="field">
        <label for="emailAddress">Email Address</label>
        <input
          type="email"
          id="emailAddress"
          name="emailAddress"
          placeholder="name@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="phoneNumber">Phone Number</label>
        <input
          type="tel"
          id="phoneNumber"
          name="phoneNumber"
          placeholder="+60 12-345 6789"
          autocomplete="tel"
          required
          pattern="^\+?\d[\d\s-]{6,}$"
        />

        <div class="hint">Use digits, spaces, or dashes. Example: +60 12-345 6789</div>
      </div>

  </fieldset>

  <img src="menu.jpg" alt="Menu Image" style="max-width: 40%; height: auto; margin: 2rem 0; display: block; margin-left: auto; margin-right: auto;" />

  <!-- menu  -->
